server:
  port: 8082

spring:
  application:
    name: case-content-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sql_murder_mystery}
    username: ${SPRING_DATASOURCE_USERNAME:smm_user}
    password: ${SPRING_DATASOURCE_PASSWORD:smm_pass}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

# Must match auth-service's jwt.secret — both services validate the same token.
jwt:
  secret: ${JWT_SECRET:change-this-in-production-please-use-a-long-random-secret}
