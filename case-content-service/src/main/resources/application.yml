server:
  port: 8082

spring:
  application:
    name: case-content-service

  datasource:
    # These variables must point to the Aiven MySQL database.
    # Keep the Aiven credentials in docker-compose/.env, not in source control.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false

  sql:
    init:
      mode: always
      data-locations: classpath:case-data.sql

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

# Must match auth-service's jwt.secret — both services validate the same token.
jwt:
  secret: ${JWT_SECRET:change-this-in-production-please-use-a-long-random-secret}
