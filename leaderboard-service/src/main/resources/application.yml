server:
  port: 8085

spring:
  application:
    name: leaderboard-service
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

jwt:
  secret: ${JWT_SECRET:change-this-in-production-please-use-a-long-random-secret}

leaderboard:
  # Redis sorted-set key for the single global leaderboard.
  redis-key: smm:leaderboard:global
